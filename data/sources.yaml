# 新闻源配置
# 支持 json / rss 两种格式
# 新增源后可在设置页面测试和编辑
sources:
- id: sina
  name: 新浪财经
  url: https://feed.mix.sina.com.cn/api/roll/get?pageid=153&lid=2509&k=&num=30&page=1
  type: json
  encoding: gbk
  enabled: true
  interval: 1800
  items_path: result.data
  fields:
    title: title
    summary: intro
    time: ctime
    url: url

- id: cls
  name: 财联社电报
  url: https://www.cls.cn/api/sw?app=CailianpressWeb&os=web&sv=8.4.7
  type: json
  encoding: utf-8
  enabled: true
  interval: 1800
  items_path: data.roll_data
  fields:
    title: title
    summary: ""
    time: ctime
    url: shareurl

- id: eastmoney_news
  name: 东方财富快讯
  url: https://push2ex.eastmoney.com/getStockNews?code=1.000001&pageindex=0&pagesize=30
  type: json
  encoding: utf-8
  enabled: true
  interval: 1800
  items_path: data.list
  fields:
    title: title
    summary: ""
    time: showtime
    url: url

- id: ifeng
  name: 凤凰网财经
  url: https://finance.ifeng.com/rss/news.xml
  type: rss
  encoding: utf-8
  enabled: true
  interval: 3600
  items_path: ""
  fields:
    title: title
    summary: description
    time: pubDate
    url: link

- id: sina_finance
  name: 新浪财经美股
  url: https://feed.mix.sina.com.cn/api/roll/get?pageid=155&lid=2510&k=&num=30&page=1
  type: json
  encoding: gbk
  enabled: false
  interval: 1800
  items_path: result.data
  fields:
    title: title
    summary: intro
    time: ctime
    url: url

- id: wallstreetcn
  name: 华尔街见闻
  url: https://wallstreetcn.com/rss
  type: rss
  encoding: utf-8
  enabled: false
  interval: 3600
  items_path: ""
  fields:
    title: title
    summary: description
    time: pubDate
    url: link
